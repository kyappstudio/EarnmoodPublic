<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>外送薪情 Earnmood · 法律文件 / Legal documents</title>
<style>
  :root{ --bg:#f7f8fa; --ink:#1b1f27; --muted:#5a6372; --rule:#dfe3ea; --accent:#2f5fd0; --warn:#8a5b00; --warnbg:#fdf6e3; }
  @media (prefers-color-scheme:dark){
    :root{ --bg:#12151c; --ink:#e7ebf3; --muted:#8a93a6; --rule:#2a3242; --accent:#5b8def; --warn:#f0b429; --warnbg:#171b26; }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
       font-family:"Microsoft JhengHei","PingFang TC","Noto Sans TC",-apple-system,"Segoe UI",sans-serif;
       font-size:17px;line-height:1.9}
  main{max-width:38rem;margin:0 auto;padding:4rem 1.4rem 5rem}
  h1{font-size:1.7rem;margin:0 0 .3rem}
  h2{font-size:1.05rem;margin:2.6rem 0 .6rem}
  p{margin:0 0 1rem;color:var(--muted)}
  .sub{color:var(--muted);font-size:.95rem;margin:0 0 2.4rem}
  .warn{border-left:3px solid var(--warn);background:var(--warnbg);color:var(--warn);
        padding:.8rem 1rem;margin:1.2rem 0}
  ul{list-style:none;padding:0;margin:0}
  li{border-top:1px solid var(--rule);padding:1.1rem 0}
  li:last-child{border-bottom:1px solid var(--rule)}
  a{color:var(--accent);font-size:1.05rem;text-decoration:none;font-weight:600}
  a:hover{text-decoration:underline}
  .v{display:block;color:var(--muted);font-size:.8rem;margin-top:.15rem}
  .back{display:inline-block;margin-bottom:2rem;font-size:.95rem}
  /* 中英兩份之間的分隔。**要看得出來是同一份文件的另一個語言**,不是新的一章
     —— 所以是整條橫線加大留白,不是小標 */
  .sep{margin:4.5rem 0 3rem;border:0;border-top:1px solid var(--rule)}
  footer{margin-top:3rem;color:var(--muted);font-size:.8rem;line-height:1.8}
</style>
</head>
<body>
  <main>
    <h1>外送薪情 Earnmood</h1>
    <p class="sub">法律文件 · Legal documents</p>
    <ul>
      <li><a href="privacy.html">隱私政策 · Privacy Policy</a><span class="v">v1.0</span></li>
      <li><a href="terms.html">使用條款 · Terms of Service</a><span class="v">v1.0</span></li>
    </ul>
    <footer>
      com.kyappstudio.earnmood<br>
      support@kyappstudio.com
    </footer>
  </main>
</body>
</html>
